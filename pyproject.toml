[project]
name = "kavach"
version = "0.1.0"
description = "Offline dual-vector fraud detection demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "librosa>=0.10.0",
  "sounddevice>=0.4.6",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "joblib>=1.3.0",
  "tldextract>=5.1.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "ruff>=0.6.0",
  "isort>=5.13.0",
  "pre-commit>=3.0.0",
]
aasist = [
  "torch>=2.0.0",
]
stt = [
  "openai-whisper>=20231117",
]
nlp = [
  "torch>=2.0.0",
  "transformers>=4.35.0",
]

[project.scripts]
kavach = "backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/audio/aasist_model.py" = ["UP007", "UP031"]
"scripts/*.py" = ["E402"]
